<html>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.9/p5.js"></script>

<script>

function setup() {
  createCanvas(400,400);
  background(50);
}

function draw() {
  if(mouseIsPressed) {

    // what % of the way between the left and right edge are we?
    var howFar = mouseX / width;  // number between 0 and 1
    var red = lerp(0, 255, howFar);
    
    // When the mouse is on the right it will be very red.
    fill(red, 0, 255-red);

    ellipse(mouseX, mouseY, 20, 20);
  }
}

</script>
</html>
