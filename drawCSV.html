<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.9/p5.js"></script>
</head>

<body>
<script>

var table;

function preload() {
  table = loadTable("names.csv", "csv", "header");
}

function setup() {
  createCanvas(600,600);
  background(200);
  var names = table.getColumn("name");
  var x = table.getColumn("x");
  var y = table.getColumn("y");
  var colors = table.getColumn("color");

  for(var i=0; i < names.length; i++) {
    fill(colors[i]);
    text(names[i], x[i], y[i]);
  }
}

</script>
</body>
</html>
